<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music-App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #535353; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #b3b3b3; }

        /* Custom Range Slider Styling (Spotify Style) */
        input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; border-radius: 2px; background: #4d4d4d; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #fff; margin-top: -4px; box-shadow: 0 0 2px rgba(0,0,0,0.5); }
        
        /* Progress bar specific styling */
        #progressBar::-webkit-slider-runnable-track { background: #1db954; } /* Spotify Green */
        #progressBar:hover::-webkit-slider-thumb { background: #1ed760; transform: scale(1.2); }
        
        /* Volume bar specific styling */
        #volumeBar::-webkit-slider-runnable-track { background: #b3b3b3; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden">

    <div class="flex flex-1 overflow-hidden p-2 gap-2">
        <!-- Left Sidebar -->
        <aside class="w-64 bg-black flex flex-col gap-2">
            <div class="bg-[#121212] rounded-lg p-4 flex flex-col gap-4">
                <button class="flex items-center gap-4 text-white font-bold hover:text-white transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"/></svg>
                    Home
                </button>
                <button class="flex items-center gap-4 text-[#b3b3b3] font-bold hover:text-white transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                    Search
                </button>
            </div>
            <div class="bg-[#121212] rounded-lg flex-1 p-2 overflow-y-auto">
                <div class="flex items-center justify-between p-2 text-[#b3b3b3] hover:text-white cursor-pointer">
                    <div class="flex items-center gap-2">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zM15.5 2.134A1 1 0 0014 3v18a1 1 0 001 1h6a1 1 0 001-1V6.464a1 1 0 00-.5-.866l-6-3.464zM9 2a1 1 0 00-1 1v18a1 1 0 102 0V3a1 1 0 00-1-1z"/></svg>
                        <span class="font-bold">Your Library</span>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-2 rounded-md hover:bg-[#1a1a1a] cursor-pointer group">
                    <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-white rounded flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    <div>
                        <p class="font-semibold text-white">Liked Songs</p>
                        <p class="text-sm text-[#b3b3b3]">Playlist • 0 songs</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-[#121212] rounded-lg overflow-y-auto relative">
            <div class="sticky top-0 bg-[#121212]/90 backdrop-blur-md p-4 z-10 flex items-center gap-4">
                <input type="text" id="searchInput" placeholder="What do you want to play?" 
                    class="flex-1 max-w-md bg-[#242424] text-white rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-white placeholder-[#a7a7a7] border border-transparent focus:border-white transition-all">
            </div>
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-6">Search Results</h2>
                <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    <p class="text-[#a7a7a7] col-span-full text-center mt-10">Search for your favorite music to begin.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Player Bar -->
    <footer id="player" class="h-24 bg-[#181818] border-t border-[#282828] flex items-center justify-between px-4 hidden">
        <!-- Left: Song Info -->
        <div class="flex items-center gap-4 w-1/3 min-w-0">
            <img id="playerThumb" src="" class="w-14 h-14 rounded bg-[#282828] object-cover">
            <div class="min-w-0">
                <h3 id="playerTitle" class="font-semibold truncate text-sm">Not Playing</h3>
                <p id="playerArtist" class="text-xs text-[#b3b3b3] truncate">Artist</p>
            </div>
        </div>

        <!-- Center: Controls -->
        <div class="flex flex-col items-center w-1/3 max-w-[45%]">
            <div class="flex items-center gap-6 mb-2">
                <!-- Shuffle (Visual only for now) -->
                <button class="text-[#b3b3b3] hover:text-white transition"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <!-- Prev (Visual only for now) -->
                <button class="text-[#b3b3b3] hover:text-white transition"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                
                <!-- Play/Pause Button -->
                <button id="playPauseBtn" class="bg-white rounded-full p-2 hover:scale-105 transition transform">
                    <svg id="playIcon" class="w-5 h-5 text-black ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="w-5 h-5 text-black hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <!-- Next (Visual only for now) -->
                <button class="text-[#b3b3b3] hover:text-white transition"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <!-- Repeat (Visual only for now) -->
                <button class="text-[#b3b3b3] hover:text-white transition"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full flex items-center gap-2 text-xs text-[#b3b3b3] font-mono">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" max="100" class="w-full h-1 rounded-full appearance-none">
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Right: Volume -->
        <div class="w-1/3 flex justify-end items-center gap-2">
             <svg class="w-5 h-5 text-[#b3b3b3]" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
             <input type="range" id="volumeBar" value="100" max="100" class="w-24 h-1 rounded-full appearance-none">
        </div>
        
        <audio id="audioPlayer"></audio>
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsGrid = document.getElementById('resultsGrid');
        const player = document.getElementById('player');
        const audioPlayer = document.getElementById('audioPlayer');
        
        // Player UI Elements
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playerThumb = document.getElementById('playerThumb');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeBar = document.getElementById('volumeBar');

        let timeout = null;
        let isDragging = false;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => fetchMusic(e.target.value), 500);
        });

        async function fetchMusic(query) {
            if (!query) return;
            resultsGrid.innerHTML = '<p class="text-[#a7a7a7] col-span-full text-center mt-10">Searching...</p>';
            try {
                const response = await fetch(`http://127.0.0.1:8000/search?query=${encodeURIComponent(query)}`);
                const songs = await response.json();
                renderResults(songs);
            } catch (error) {
                resultsGrid.innerHTML = '<p class="text-red-400 col-span-full text-center">Error fetching music. Is the backend running?</p>';
            }
        }

        function renderResults(songs) {
            resultsGrid.innerHTML = '';
            if (songs.length === 0) {
                resultsGrid.innerHTML = '<p class="text-[#a7a7a7] col-span-full text-center">No results found.</p>';
                return;
            }
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'bg-[#181818] hover:bg-[#282828] p-4 rounded-md transition-all duration-300 cursor-pointer group relative';
                card.innerHTML = `
                    <div class="relative mb-4">
                        <img src="${song.thumbnail}" class="w-full aspect-square object-cover rounded-md shadow-lg bg-[#282828]">
                        <button class="absolute bottom-2 right-2 bg-green-500 rounded-full p-3 opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 shadow-xl hover:scale-105 hover:bg-green-400">
                            <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                    <h3 class="font-bold truncate text-white mb-1">${song.title}</h3>
                    <p class="text-sm text-[#a7a7a7] truncate">${song.artist}</p>
                `;
                card.addEventListener('click', () => playSong(song));
                resultsGrid.appendChild(card);
            });
        }

        async function playSong(song) {
            player.classList.remove('hidden');
            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist;
            playerThumb.src = song.thumbnail;
            
            // Show loading state
            playIcon.classList.add('hidden');
            pauseIcon.classList.add('hidden');

            const response = await fetch(`http://127.0.0.1:8000/stream?videoId=${song.videoId}`);
            const data = await response.json();
            
            audioPlayer.src = data.url;
            audioPlayer.play();
        }

        // ⏯️ Play/Pause Logic
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        });

        audioPlayer.addEventListener('play', () => {
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        });

        audioPlayer.addEventListener('pause', () => {
            pauseIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');
        });

        // ️ Progress Bar Logic
        audioPlayer.addEventListener('timeupdate', () => {
            if (!isDragging) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progress || 0;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('input', (e) => {
            isDragging = true;
            const time = (e.target.value / 100) * audioPlayer.duration;
            currentTimeEl.textContent = formatTime(time);
        });

        progressBar.addEventListener('change', (e) => {
            isDragging = false;
            audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
        });

        // 🔊 Volume Logic
        volumeBar.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value / 100;
        });

        // Helper: Format seconds to MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
